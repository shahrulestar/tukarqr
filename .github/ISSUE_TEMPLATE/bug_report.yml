name: Bug report
description: Report something that is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not share real
        payment QR payloads or personal banking details in public issues.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
      placeholder: After uploading a blurry QR image, decoding fails with...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The QR should decode and show the download card.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps so we can reproduce the issue.
      placeholder: |
        1. Go to `/`
        2. Upload a PNG QR image
        3. Wait for processing to finish
        4. See error toast
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Upload / camera / paste
        - QR decoding
        - Download / export
        - UI / layout
        - About / list pages
        - Build / deployment
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 136, Safari 18, Firefox 139
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 15 / iOS 18, Windows 11, Android 14
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - tukarqr.my (production)
        - Local development (`npm run dev`)
        - Static build (`npm run build` + preview)
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images or paste links. Redact sensitive QR data.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues before opening this report.
          required: true
