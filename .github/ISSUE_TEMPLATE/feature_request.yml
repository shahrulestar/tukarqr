name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share the user problem first. Feature requests that explain who benefits
        and why are easier to evaluate and implement.

  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What problem are you trying to solve?
      placeholder: On mobile, after batch upload I cannot easily find the download card...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Upload / input
        - QR decoding
        - Export / download
        - UX / accessibility
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to open a pull request for this if the approach is agreed.
          required: false
        - label: I searched existing issues before opening this request.
          required: true
